<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>นัดนะ NatNa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-logo"><img src="assets/logo.png" alt="NatNa logo"></div>
    <div class="brand-text">
      <div class="brand"><span class="brand-th">นัดนะ</span></div>
      <p class="tagline">ช่วยเตรียมความพร้อมก่อนไปพบแพทย์ตามนัด</p>
    </div>
  </header>

  <!-- ============ HOME PAGE ============ -->
  <div id="homePage">
    <div class="home-toolbar">
      <div class="view-toggle">
        <button id="btnCardView" class="active" onclick="setHomeView('card')">การ์ด</button>
        <button id="btnCalView" onclick="setHomeView('calendar')">ปฏิทิน</button>
      </div>
      <button class="add-btn" onclick="showAddForm()">+ เพิ่มนัด</button>
    </div>

    <div id="cardView"></div>

    <div id="calendarView" class="hidden">
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="cal-month-label" id="calMonthLabel"></div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-day-list" id="calDayList"></div>
    </div>
  </div>

  <!-- ============ ADD APPOINTMENT PAGE ============ -->
  <div id="addPage" class="hidden">
    <button class="back-btn" onclick="showHome()">← กลับ</button>
    <div class="card">
      <div class="manage-title">เพิ่มนัดหมายใหม่</div>
      <div class="form-field"><label>ชื่อคนไข้</label><input type="text" id="fName" placeholder="เช่น คุณยายสมศรี ใจดี"></div>
      <div class="form-field"><label>สถานที่นัด</label><input type="text" id="fPlace" placeholder="เช่น โรงพยาบาลศิริราช · แผนกอายุรกรรม"></div>
      <div class="form-field"><label>วันที่นัด</label><input type="date" id="fDate"></div>
      <div class="form-field"><label>เวลานัด</label><input type="time" id="fTime"></div>
      <button class="form-submit" onclick="submitAddForm()">บันทึกนัดหมาย</button>
    </div>
  </div>

  <!-- ============ DETAIL PAGE (checklist) ============ -->
  <div id="detailPage" class="hidden">
    <button class="back-btn" onclick="showHome()">← กลับหน้าแรก</button>
    <div class="card">
      <div class="patient-row">
        <div>
          <div class="patient-name" id="dName"></div>
          <div class="patient-place" id="dPlace"></div>
          <div class="appt-time" id="dTime"></div>
        </div>
        <div class="status-pill status-notready" id="statusPill">ยังไม่พร้อม</div>
      </div>
      <ul class="checklist" id="checklist"></ul>
      <div class="add-row">
        <input type="text" id="newItem" placeholder="เพิ่มรายการที่ต้องเตรียม...">
        <button onclick="addCustomItem()">เพิ่ม</button>
      </div>
      <div class="suggest-head">
        <div class="suggest-title">รายการแนะนำ (แตะเพื่อเพิ่ม)</div>
        <button class="manage-link" onclick="showManage()">⚙ จัดการรายการแนะนำ</button>
      </div>
      <div class="suggest-chips" id="suggestChips"></div>
    </div>
  </div>

  <!-- ============ MANAGE GUIDE LIST PAGE ============ -->
  <div id="managePage" class="hidden">
    <button class="back-btn" onclick="showDetail(currentApptId)">← กลับ</button>
    <div class="card">
      <div class="manage-title">จัดการรายการแนะนำ</div>
      <p class="manage-sub">แก้ไขรายการที่จะไปโผล่เป็นตัวเลือกแนะนำในหน้าเช็คลิสต์</p>
      <div id="guideManageList"></div>
      <div class="add-row" style="margin-top:16px;">
        <input type="text" id="newGuideItem" placeholder="เพิ่มรายการแนะนำใหม่...">
        <button onclick="addGuideItem()">เพิ่ม</button>
      </div>
    </div>
  </div>

  <p class="footnote">ตัวอย่างสาธิต — Day 1 เวอร์ชัน 3</p>
</div>

<!-- Confirm delete modal -->
<div class="modal-overlay hidden" id="confirmModal">
  <div class="modal-box">
    <p>ต้องการลบนัดหมายนี้ใช่หรือไม่?</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cancelDelete()">ยกเลิก</button>
      <button class="btn-confirm" onclick="confirmDelete()">ลบ</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
