<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>นัดนะ NatNa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --cream:#FBF6EA;
    --gold:#B5924F; --gold-soft:#EBDFC0;
    --silver:#B9B4A8; --silver-soft:#EFECE4;
    --ink:#0C6269; --ink-soft:#8B8375;
    --ready:#3C7A5D; --ready-bg:#E4F0E9;
    --notready:#BE4F3C; --notready-bg:#FBE7E1;
    --expired-bg:#EDEAE2; --expired-ink:#9B927E;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding:30px 16px 70px;}
  .wrap{max-width:520px;margin:0 auto;}
  .hidden{display:none !important;}

  header{
    margin-bottom:26px;display:flex;align-items:center;gap:16px;text-align:left;
    position:relative;overflow:hidden;
    background:linear-gradient(135deg, rgba(12,98,105,0.07), rgba(238,186,111,0.16));
    border:1px solid rgba(12,98,105,0.15);
    border-radius:22px;padding:18px 20px;
  }
  header::before{
    content:'';position:absolute;width:170px;height:170px;left:-55px;top:-65px;
    background:radial-gradient(circle, rgba(238,186,111,0.40), transparent 70%);
    filter:blur(2px);pointer-events:none;
  }
  header::after{
    content:'';position:absolute;width:130px;height:130px;right:-45px;bottom:-60px;
    background:radial-gradient(circle, rgba(12,98,105,0.16), transparent 70%);
    filter:blur(2px);pointer-events:none;
  }
  .brand-logo{flex:none;position:relative;z-index:1;}
  .brand-logo img{width:80px;height:80px;object-fit:contain;display:block;}
  .brand-text{display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;}
  .brand{display:flex;align-items:baseline;justify-content:flex-start;gap:10px;}
  .brand-th{font-size:30px;font-weight:700;}
  .brand-en{font-size:16px;font-weight:500;color:var(--gold);letter-spacing:0.5px;}
  .tagline{margin-top:6px;font-size:15px;color:var(--ink-soft);}

  /* ===== Home page ===== */
  .home-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;}
  .view-toggle{display:flex;background:var(--silver-soft);border-radius:12px;padding:3px;}
  .view-toggle button{
    border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;
    padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft);
  }
  .view-toggle button.active{background:var(--white);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.06);}
  .add-btn{
    background:var(--gold);color:white;border:none;border-radius:12px;
    padding:10px 16px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .add-btn:hover{background:#9c7c40;}

  .appt-card{
    background:var(--white);border:1px solid var(--gold-soft);border-radius:18px;
    padding:18px 18px;margin-bottom:14px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .appt-card:hover{border-color:var(--gold);}
  .appt-card:active, .appt-card.pressed{border:2px solid #8a6a34;box-shadow:0 0 0 3px rgba(181,146,79,0.22);}
  .appt-name{font-size:18px;font-weight:700;}
  .appt-place{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  .appt-date{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  .appt-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .badge{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;}
  .badge-urgent{background:var(--notready-bg);color:var(--notready);}
  .badge-upcoming{background:var(--gold-soft);color:#8a6a34;}
  .badge-expired{background:var(--expired-bg);color:var(--expired-ink);}
  .trash-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:16px;padding:4px;}
  .trash-btn:hover{color:var(--notready);}
  .empty-state{text-align:center;color:var(--ink-soft);font-size:15px;padding:40px 10px;}

  /* ===== Calendar view ===== */
  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .cal-nav button{background:none;border:none;font-size:18px;color:var(--gold);cursor:pointer;padding:4px 10px;}
  .cal-month-label{font-size:16px;font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--silver-soft);border-radius:14px;padding:2px;border:1px solid var(--gold-soft);overflow:hidden;}
  .cal-weekday{text-align:center;font-size:12px;color:var(--ink-soft);font-weight:600;padding:6px 0;background:var(--white);}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--ink);position:relative;cursor:default;
    background:var(--white);border:1px solid var(--silver-soft);
  }
  .cal-day.has-appt{cursor:pointer;font-weight:700;}
  .cal-day.empty-cell{background:var(--cream);visibility:visible;cursor:default;}
  .cal-day.cal-cell-urgent{background:var(--notready-bg);color:var(--notready);}
  .cal-day.cal-cell-upcoming{background:var(--gold-soft);color:#8a6a34;}
  .cal-day.cal-cell-expired{background:var(--expired-bg);color:var(--expired-ink);}
  .cal-day.selected{box-shadow:inset 0 0 0 2px var(--ink);}
  .cal-day-list{margin-top:16px;}

  /* ===== Detail page (checklist) ===== */
  .card{background:var(--white);border:1px solid var(--gold-soft);border-radius:20px;padding:24px 22px;margin-bottom:18px;box-shadow:0 2px 14px rgba(181,146,79,0.08);}
  .back-btn{background:none;border:none;cursor:pointer;font-family:inherit;font-size:15px;color:var(--gold);display:flex;align-items:center;gap:4px;padding:6px 0;margin-bottom:14px;}
  .back-btn:hover{color:#9c7c40;}
  .patient-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .patient-name{font-size:22px;font-weight:700;}
  .patient-place{font-size:15px;color:var(--ink-soft);margin-top:3px;}
  .appt-time{font-size:15px;color:var(--ink-soft);margin-top:2px;}
  .status-pill{font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;white-space:nowrap;}
  .status-notready{background:var(--notready-bg);color:var(--notready);}
  .status-ready{background:var(--ready-bg);color:var(--ready);}
  .checklist{list-style:none;padding:0;margin:0;border-top:1px solid var(--silver-soft);padding-top:14px;}
  .check-item{display:flex;align-items:center;gap:12px;padding:10px 2px;font-size:17px;}
  .check-box{width:26px;height:26px;border-radius:8px;border:2px solid var(--silver);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;}
  .check-item.done .check-box{background:var(--ready);border-color:var(--ready);}
  .check-box svg{opacity:0;transition:opacity .1s;}
  .check-item.done .check-box svg{opacity:1;}
  .check-label{flex:1;outline:none;padding:2px 4px;border-radius:6px;}
  .check-label:focus{background:var(--silver-soft);}
  .check-item.done .check-label{color:var(--ink-soft);text-decoration:line-through;}
  .item-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:14px;padding:6px;flex:none;}
  .item-btn:hover{color:var(--notready);}
  .add-row{display:flex;gap:8px;margin-top:12px;}
  .add-row input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--silver-soft);font-family:inherit;font-size:15px;background:var(--cream);}
  .add-row button{background:var(--gold);color:white;border:none;border-radius:12px;padding:0 18px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;}
  .add-row button:hover{background:#9c7c40;}
  .suggest-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px 4px;}
  .suggest-title{font-size:14px;font-weight:600;color:var(--ink-soft);}
  .manage-link{font-size:13px;color:var(--gold);background:none;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;padding:2px;}
  .manage-link:hover{color:#9c7c40;text-decoration:underline;}
  .suggest-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:14px;color:var(--ink-soft);background:var(--silver-soft);border:1px solid var(--silver-soft);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .15s ease;}
  .chip:hover{border-color:var(--gold);color:var(--ink);}
  .empty-note{font-size:13px;color:var(--ink-soft);font-style:italic;}

  /* ===== Manage guide list page ===== */
  .manage-title{font-size:19px;font-weight:700;}
  .manage-sub{font-size:14px;color:var(--ink-soft);margin:4px 0 18px 0;}
  .guide-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--silver-soft);font-size:16px;}

  /* ===== Add appointment form / modal ===== */
  .form-field{margin-bottom:14px;}
  .form-field label{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--silver-soft);font-family:inherit;font-size:15px;background:var(--cream);}
  .form-submit{width:100%;background:var(--gold);color:white;border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;}
  .form-submit:hover{background:#9c7c40;}

  /* ===== Confirm modal ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(58,52,42,0.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .modal-box{background:var(--white);border-radius:18px;padding:24px 22px;max-width:340px;width:100%;text-align:center;}
  .modal-box p{font-size:16px;margin:0 0 20px 0;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{flex:1;padding:12px;border-radius:12px;border:none;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;}
  .btn-cancel{background:var(--silver-soft);color:var(--ink);}
  .btn-confirm{background:var(--notready);color:white;}
  .btn-cancel:hover{background:var(--gold-soft);}
  .btn-confirm:hover{background:#a03f2f;}

  .footnote{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:26px;}
</style>
</head>

<script>
  // ================= STATE =================
  let guideItems = [
    'งดน้ำงดอาหาร 8 ชม.ก่อนนัด','พกผลตรวจเดิม (ถ้ามี)','พาญาติหรือผู้ดูแลไปด้วย',
    'พกแว่นตา / เครื่องช่วยฟัง','เตรียมคำถามที่จะถามหมอ','พกสมุดบันทึกอาการ'
  ];

  function iso(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  const today = new Date(); today.setHours(0,0,0,0);

  let appointments = [
    { id:crypto.randomUUID(), name:'คุณยายสมศรี ใจดี', place:'โรงพยาบาลศิริราช · แผนกอายุรกรรม', date:'2026-09-11', time:'09:30',
      checklist:[
        {id:crypto.randomUUID(), text:'พกบัตรประชาชน / บัตรโรงพยาบาล', done:false, source:'custom'},
        {id:crypto.randomUUID(), text:'พกยาที่กินอยู่ประจำ', done:false, source:'custom'}
      ] },
    { id:crypto.randomUUID(), name:'คุณตาประยุทธ์ มั่นคง', place:'โรงพยาบาลรามาธิบดี · แผนกหัวใจ', date:'2026-09-20', time:'13:00', checklist:[] },
    { id:crypto.randomUUID(), name:'คุณป้าวันเพ็ญ สุขใจ', place:'โรงพยาบาลจุฬาลงกรณ์ · แผนกตา', date:'2026-08-30', time:'10:15', checklist:[] },
    { id:crypto.randomUUID(), name:'คุณลุงสมชาย รุ่งเรือง', place:'โรงพยาบาลศิริราช · แผนกกระดูก', date:'2026-10-05', time:'14:30', checklist:[] }
  ];

  let currentApptId = null;
  let deleteTargetId = null;
  let calMonth = today.getMonth();
  let calYear = today.getFullYear();
  let selectedCalDate = null;

  // ================= NAV between top-level pages =================
  function hideAllPages(){
    ['homePage','addPage','detailPage','managePage'].forEach(id => document.getElementById(id).classList.add('hidden'));
  }
  function showHome(){
    hideAllPages();
    document.getElementById('homePage').classList.remove('hidden');
    renderCardView();
    renderCalendar();
  }
  function showAddForm(){
    hideAllPages();
    document.getElementById('addPage').classList.remove('hidden');
    document.getElementById('fName').value='';
    document.getElementById('fPlace').value='';
    document.getElementById('fDate').value='';
    document.getElementById('fTime').value='';
  }
  function showDetail(id){
    currentApptId = id;
    hideAllPages();
    document.getElementById('detailPage').classList.remove('hidden');
    renderDetail();
  }
  function showManage(){
    hideAllPages();
    document.getElementById('managePage').classList.remove('hidden');
    renderGuideManageList();
  }

  // ================= Status helper =================
  function apptStatus(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    const diffDays = Math.round((d - today) / 86400000);
    if(diffDays < 0) return { label:'หมดอายุ', cls:'expired', diffDays };
    if(diffDays <= 3) return { label: diffDays===0 ? 'วันนี้' : `ใกล้มาถึงอีก ${diffDays} วัน`, cls:'urgent', diffDays };
    return { label:`ใกล้มาถึงอีก ${diffDays} วัน`, cls:'upcoming', diffDays };
  }
  function fmtDateTh(dateStr){
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const [y,m,d] = dateStr.split('-').map(Number);
    return `${d} ${months[m-1]} ${y+543}`;
  }

  // ================= Card view =================
  function renderCardView(){
    const el = document.getElementById('cardView');
    el.innerHTML = '';
    if(appointments.length === 0){
      el.innerHTML = '<div class="empty-state">ยังไม่มีนัดหมาย กด "+ เพิ่มนัด" เพื่อเริ่มต้น</div>';
      return;
    }
    const sorted = [...appointments].sort((a,b) => {
      const da = apptStatus(a.date).diffDays, db = apptStatus(b.date).diffDays;
      const aExpired = da < 0, bExpired = db < 0;
      if(aExpired !== bExpired) return aExpired ? 1 : -1; // นัดที่ยังไม่หมดอายุขึ้นก่อนเสมอ
      if(!aExpired) return da - db; // ใกล้ถึงที่สุดขึ้นก่อน
      return db - da; // หมดอายุ: เพิ่งผ่านไปหมาดๆ ขึ้นก่อน
    });
    sorted.forEach(appt => {
      const st = apptStatus(appt.date);
      const card = document.createElement('div');
      card.className = 'appt-card';
      card.innerHTML = `
        <div>
          <div class="appt-name">${appt.name}</div>
          <div class="appt-place">${appt.place}</div>
          <div class="appt-date">${fmtDateTh(appt.date)} · ${appt.time} น.</div>
        </div>
        <div class="appt-right">
          <span class="badge badge-${st.cls}">${st.label}</span>
          <button class="trash-btn" title="ลบนัดหมาย">🗑</button>
        </div>
      `;
      card.addEventListener('click', (e) => {
        if(e.target.closest('.trash-btn')) return;
        showDetail(appt.id);
      });
      card.querySelector('.trash-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        askDelete(appt.id);
      });
      el.appendChild(card);
    });
  }

  // ================= Delete confirm =================
  function askDelete(id){
    deleteTargetId = id;
    document.getElementById('confirmModal').classList.remove('hidden');
  }
  function cancelDelete(){
    deleteTargetId = null;
    document.getElementById('confirmModal').classList.add('hidden');
  }
  function confirmDelete(){
    appointments = appointments.filter(a => a.id !== deleteTargetId);
    deleteTargetId = null;
    document.getElementById('confirmModal').classList.add('hidden');
    renderCardView();
    renderCalendar();
  }

  // ================= Add appointment =================
  function submitAddForm(){
    const name = document.getElementById('fName').value.trim();
    const place = document.getElementById('fPlace').value.trim();
    const date = document.getElementById('fDate').value;
    const time = document.getElementById('fTime').value || '00:00';
    if(!name || !date){ alert('กรุณากรอกชื่อคนไข้และวันที่นัดอย่างน้อยค่ะ'); return; }
    appointments.push({ id:crypto.randomUUID(), name, place, date, time, checklist:[] });
    showHome();
  }

  // ================= Home view toggle =================
  function setHomeView(view){
    document.getElementById('btnCardView').classList.toggle('active', view==='card');
    document.getElementById('btnCalView').classList.toggle('active', view==='calendar');
    document.getElementById('cardView').classList.toggle('hidden', view!=='card');
    document.getElementById('calendarView').classList.toggle('hidden', view!=='calendar');
    if(view==='calendar') renderCalendar();
  }

  // ================= Calendar view =================
  function changeMonth(delta){
    calMonth += delta;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    if(calMonth > 11){ calMonth = 0; calYear++; }
    selectedCalDate = null;
    renderCalendar();
  }
  function renderCalendar(){
    const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    document.getElementById('calMonthLabel').textContent = `${monthNames[calMonth]} ${calYear+543}`;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(w => {
      const wd = document.createElement('div');
      wd.className = 'cal-weekday'; wd.textContent = w;
      grid.appendChild(wd);
    });

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

    for(let i=0;i<firstDay;i++){
      const empty = document.createElement('div');
      empty.className = 'cal-day empty-cell';
      grid.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const dateStr = iso(calYear, calMonth+1, d);
      const dayAppts = appointments.filter(a => a.date === dateStr);
      const cell = document.createElement('div');
      const statusCls = dayAppts.length ? apptStatus(dayAppts[0].date).cls : '';
      cell.className = 'cal-day' + (dayAppts.length ? ` has-appt cal-cell-${statusCls}` : '') + (selectedCalDate===dateStr ? ' selected' : '');
      cell.innerHTML = `<span>${d}</span>`;
      if(dayAppts.length){
        cell.addEventListener('click', () => { selectedCalDate = dateStr; renderCalendar(); renderCalDayList(dayAppts); });
      }
      grid.appendChild(cell);
    }

    if(selectedCalDate){
      const dayAppts = appointments.filter(a => a.date === selectedCalDate);
      if(dayAppts.length) renderCalDayList(dayAppts); else document.getElementById('calDayList').innerHTML='';
    } else {
      document.getElementById('calDayList').innerHTML = '<p class="empty-note">แตะวันที่มีจุดสีเพื่อดูนัดหมาย</p>';
    }
  }
  function renderCalDayList(dayAppts){
    const el = document.getElementById('calDayList');
    el.innerHTML = '';
    dayAppts.forEach(appt => {
      const st = apptStatus(appt.date);
      const card = document.createElement('div');
      card.className = 'appt-card';
      card.innerHTML = `
        <div>
          <div class="appt-name">${appt.name}</div>
          <div class="appt-place">${appt.place}</div>
          <div class="appt-date">${fmtDateTh(appt.date)} · ${appt.time} น.</div>
        </div>
        <div class="appt-right"><span class="badge badge-${st.cls}">${st.label}</span></div>
      `;
      card.addEventListener('click', () => showDetail(appt.id));
      el.appendChild(card);
    });
  }

  // ================= Detail page (checklist) =================
  function currentAppt(){ return appointments.find(a => a.id === currentApptId); }

  function renderDetail(){
    const appt = currentAppt();
    document.getElementById('dName').textContent = appt.name;
    document.getElementById('dPlace').textContent = appt.place;
    document.getElementById('dTime').textContent = `${fmtDateTh(appt.date)} · ${appt.time} น.`;
    renderChecklist();
    renderSuggestChips();
  }

  function renderChecklist(){
    const appt = currentAppt();
    const checklistEl = document.getElementById('checklist');
    checklistEl.innerHTML = '';
    appt.checklist.forEach(item => {
      const li = document.createElement('li');
      li.className = 'check-item' + (item.done ? ' done' : '');
      li.innerHTML = `
        <div class="check-box"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7l3.5 3.5L12 3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span class="check-label" contenteditable="true">${item.text}</span>
        <button class="item-btn" title="ลบ">✕</button>
      `;
      li.querySelector('.check-box').addEventListener('click', () => {
        item.done = !item.done; li.classList.toggle('done'); updateStatus();
      });
      li.querySelector('.check-label').addEventListener('input', e => { item.text = e.target.textContent; });
      li.querySelector('.item-btn').addEventListener('click', () => {
        if(item.source === 'guide' && !guideItems.includes(item.text)) guideItems.push(item.text);
        appt.checklist = appt.checklist.filter(i => i.id !== item.id);
        renderChecklist(); renderSuggestChips();
      });
      checklistEl.appendChild(li);
    });
    updateStatus();
  }

  function renderSuggestChips(){
    const el = document.getElementById('suggestChips');
    el.innerHTML = '';
    if(guideItems.length === 0){
      el.innerHTML = '<span class="empty-note">ยังไม่มีรายการแนะนำ ลองเพิ่มได้ที่หน้าจัดการ</span>';
      return;
    }
    guideItems.forEach(text => {
      const chip = document.createElement('span');
      chip.className = 'chip'; chip.textContent = text;
      chip.addEventListener('click', () => {
        const appt = currentAppt();
        appt.checklist.push({ id:crypto.randomUUID(), text, done:false, source:'guide' });
        guideItems = guideItems.filter(g => g !== text);
        renderChecklist(); renderSuggestChips();
      });
      el.appendChild(chip);
    });
  }

  function addCustomItem(){
    const input = document.getElementById('newItem');
    const text = input.value.trim();
    if(!text) return;
    currentAppt().checklist.push({ id:crypto.randomUUID(), text, done:false, source:'custom' });
    input.value = '';
    renderChecklist();
  }
  document.getElementById('newItem').addEventListener('keypress', e => { if(e.key==='Enter') addCustomItem(); });

  function updateStatus(){
    const appt = currentAppt();
    const total = appt.checklist.length;
    const done = appt.checklist.filter(i => i.done).length;
    const pill = document.getElementById('statusPill');
    if(total > 0 && done === total){ pill.textContent='พร้อมแล้ว'; pill.className='status-pill status-ready'; }
    else { pill.textContent='ยังไม่พร้อม'; pill.className='status-pill status-notready'; }
  }

  // ================= Manage guide list =================
  function renderGuideManageList(){
    const el = document.getElementById('guideManageList');
    el.innerHTML = '';
    if(guideItems.length === 0){ el.innerHTML = '<p class="empty-note">ยังไม่มีรายการแนะนำ</p>'; return; }
    guideItems.forEach(text => {
      const row = document.createElement('div');
      row.className = 'guide-row';
      row.innerHTML = `<span style="flex:1;">${text}</span><button class="item-btn" title="ลบ">✕</button>`;
      row.querySelector('.item-btn').addEventListener('click', () => {
        guideItems = guideItems.filter(g => g !== text);
        renderGuideManageList();
      });
      el.appendChild(row);
    });
  }
  function addGuideItem(){
    const input = document.getElementById('newGuideItem');
    const text = input.value.trim();
    if(!text) return;
    guideItems.push(text);
    input.value = '';
    renderGuideManageList();
  }
  document.getElementById('newGuideItem').addEventListener('keypress', e => { if(e.key==='Enter') addGuideItem(); });

  // ================= init =================
  showHome();
</script>
</body>
</html>
